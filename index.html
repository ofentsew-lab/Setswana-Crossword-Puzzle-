<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setswana Crossword Puzzle</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Setswana Crossword">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Setswana Crossword Puzzle</h1>
            <div class="score">Score: <span id="score">0</span></div>
        </header>
        
        <main>
            <div class="crossword-board" id="crossword">
                <!-- Crossword grid will be generated by JavaScript -->
            </div>
            
            <div class="clues-section">
                <h3>Across</h3>
                <div id="across-clues"></div>
                
                <h3>Down</h3>
                <div id="down-clues"></div>
            </div>
            
            <div class="controls">
                <button id="check-btn">Check Answers</button>
                <button id="reset-btn">Reset Puzzle</button>
                <button id="hint-btn">Get Hint</button>
            </div>
        </main>
        
        <footer>
            <p>Learn Setswana through puzzles!</p>
            <div class="pwa-install" id="installPrompt" style="display: none;">
                <p>Install for better experience</p>
                <button id="installBtn">Install App</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
